name: Build AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: |
          npm install
          npx cap sync android || npx cap add android
          npx cap sync android
      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Copied google-services.json"
          fi
      - name: Create Keystore and Signing
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass trackthai123 -keypass trackthai123 -dname "CN=TrackThai, OU=Cafe Community, O=Cafe Community, L=Nakhon Pathom, ST=Nakhon Pathom, C=TH"
          cat > android/app/key.properties <<'EOF'
          storePassword=trackthai123
          keyPassword=trackthai123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          python3 <<'PY'
          import pathlib
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text()
          # เพิ่ม signingConfigs ถ้ายังไม่มี
          if "signingConfigs" not in t:
              t = t.replace("android {", "android {\n    signingConfigs {\n        release {\n            storeFile file('upload-keystore.jks')\n            storePassword 'trackthai123'\n            keyAlias 'upload'\n            keyPassword 'trackthai123'\n        }\n    }", 1)
          # ให้ buildType release ใช้ signingConfigs.release - หาใน buildTypes เท่านั้น
          if "signingConfig signingConfigs.release" not in t:
              bi = t.find("buildTypes")
              if bi != -1:
                  ri = t.find("release {", bi)
                  if ri != -1:
                      insert_at = ri + len("release {")
                      t = t[:insert_at] + "\n            signingConfig signingConfigs.release" + t[insert_at:]
          p.write_text(t)
          print("Patched build.gradle")
          PY
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TrackThai-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Build APK for testing
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackThai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
