name: Build AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Create Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass trackthai123 -keypass trackthai123 -dname "CN=TrackThai, OU=Cafe Community, O=Cafe Community, L=Nakhon Pathom, ST=Nakhon Pathom, C=TH"
          echo "storePassword=trackthai123" > android/key.properties
          echo "keyPassword=trackthai123" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TrackThai-AAB
          path: build/app/outputs/bundle/release/app-release.aab
