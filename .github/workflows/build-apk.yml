name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: |
          npm install
          npx cap sync android || npx cap add android
          npx cap sync android
      - name: Copy google-services.json into android/app
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "✅ Copied google-services.json to android/app/"
            ls -l android/app/google-services.json
          else
            echo "⚠️ google-services.json not found in repo root - building without Firebase"
          fi
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackThai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
